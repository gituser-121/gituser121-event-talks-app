<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Talks 2026</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        h1 {
            color: #ffffff;
            font-size: 2.5rem;
        }
        .search-container {
            margin-top: 1rem;
        }
        #category-search {
            width: 50%;
            padding: 0.8rem;
            border-radius: 25px;
            border: 1px solid #333;
            background-color: #2c2c2c;
            color: #e0e0e0;
            font-size: 1rem;
        }
        #category-search:focus {
            outline: none;
            border-color: #bb86fc;
        }
        .talk, .break {
            background-color: #1e1e1e;
            border-left: 5px solid #bb86fc;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 5px;
        }
        .break {
            border-left-color: #03dac6;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .talk-time {
            font-weight: bold;
            color: #bb86fc;
            margin-bottom: 0.5rem;
        }
        .talk-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }
        .talk-speakers {
            font-style: italic;
            color: #b0b0b0;
            margin-bottom: 1rem;
        }
        .talk-categories {
            margin-top: 1rem;
        }
        .talk-category {
            display: inline-block;
            background-color: #333;
            color: #bb86fc;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.9rem;
            margin-right: 0.5rem;
        }
        .talk-description {
            margin-top: 1rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Tech Talks 2026</h1>
            <div class="search-container">
                <input type="text" id="category-search" placeholder="Search by category...">
            </div>
        </header>
        <main id="schedule-container">
            <!-- Schedule will be generated by JavaScript -->
        </main>
    </div>
    <script>
        const talks = [
            {
                title: "The Future of Frontend: A Deep Dive",
                speakers: ["Alex Chen"],
                category: ["Frontend", "JavaScript", "WebAssembly"],
                duration: 60,
                description: "Explore the next generation of frontend technologies, from reactive frameworks to the potential of WebAssembly for high-performance web applications."
            },
            {
                title: "Building Scalable APIs with GraphQL",
                speakers: ["Maria Rodriguez", "John Doe"],
                category: ["Backend", "API", "GraphQL"],
                duration: 60,
                description: "A comprehensive guide to designing and building flexible and efficient APIs using GraphQL. Learn how to avoid common pitfalls and scale your services."
            },
            {
                title: "DevOps in the Cloud-Native Era",
                speakers: ["Sam Patel"],
                category: ["DevOps", "Kubernetes", "CI/CD"],
                duration: 60,
                description: "Discover best practices for implementing DevOps in a cloud-native environment. This talk covers container orchestration with Kubernetes, and building robust CI/CD pipelines."
            },
            {
                title: "The Art of Prompt Engineering",
                speakers: ["Dr. Evelyn Reed"],
                category: ["AI", "LLM", "NLP"],
                duration: 60,
                description: "Learn the secrets of crafting effective prompts for Large Language Models. This session will cover techniques to get the most out of generative AI for various applications."
            },
            {
                title: "Securing Modern Web Applications",
                speakers: ["Chris Williams", "Dana Kim"],
                category: ["Security", "Web", "Cybersecurity"],
                duration: 60,
                description: "An overview of the current web security landscape. We will discuss common vulnerabilities, defensive coding practices, and how to protect your applications from attacks."
            },
            {
                title: "Data Streaming with Apache Kafka",
                speakers: ["Ben Carter"],
                category: ["Data", "Backend", "Streaming"],
                duration: 60,
                description: "A practical introduction to building real-time data pipelines with Apache Kafka. Learn how to handle high-throughput data streams for analytics and event-driven architectures."
            }
        ];

        const scheduleContainer = document.getElementById('schedule-container');
        const searchInput = document.getElementById('category-search');

        function formatTime(date) {
            return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function renderSchedule(filteredTalks) {
            scheduleContainer.innerHTML = '';
            let currentTime = new Date();
            currentTime.setHours(10, 0, 0, 0); // Event starts at 10:00 AM

            const talksToRender = filteredTalks || talks;
            let talksRendered = 0;

            talksToRender.forEach((talk, index) => {
                // Find the original index to manage breaks correctly
                const originalIndex = talks.findIndex(t => t.title === talk.title);

                if (originalIndex === 3 && talksRendered < 3) {
                     // Find the next talk time to set the lunch break start time
                    const nextTalk = talksToRender.find((t, i) => talks.findIndex(originalTalk => originalTalk.title === t.title) >= 3);
                    if(nextTalk) {
                         const nextTalkStartTime = new Date(currentTime.getTime() + 10 * 60000);
                         const lunchStartTime = new Date(nextTalkStartTime.getTime() - 10 * 60000);
                         const lunchEndTime = new Date(lunchStartTime.getTime() + 60 * 60000);
                         
                        const lunchBreak = document.createElement('div');
                        lunchBreak.className = 'break';
                        lunchBreak.innerHTML = `<div>Lunch Break</div><div>${formatTime(lunchStartTime)} - ${formatTime(lunchEndTime)}</div>`;
                        scheduleContainer.appendChild(lunchBreak);
                        currentTime = lunchEndTime;
                    }
                } else if (talksRendered > 0) {
                     currentTime.setMinutes(currentTime.getMinutes() + 10);
                }


                const talkElement = document.createElement('div');
                talkElement.className = 'talk';

                const startTime = new Date(currentTime.getTime());
                const endTime = new Date(startTime.getTime() + talk.duration * 60000);

                talkElement.innerHTML = `
                    <div class="talk-time">${formatTime(startTime)} - ${formatTime(endTime)}</div>
                    <div class="talk-title">${talk.title}</div>
                    <div class="talk-speakers">By: ${talk.speakers.join(', ')}</div>
                    <div class="talk-description">${talk.description}</div>
                    <div class="talk-categories">
                        ${talk.category.map(cat => `<span class="talk-category">${cat}</span>`).join('')}
                    </div>
                `;
                scheduleContainer.appendChild(talkElement);
                currentTime = endTime;
                talksRendered++;
            });
             if (filteredTalks && filteredTalks.length > 0 && talks.findIndex(t => t.title === filteredTalks[0].title) < 3 && filteredTalks.length < 3) {
                const nextTalkAfterFiltered = talks.slice(3, talks.length);
                if (nextTalkAfterFiltered.length > 0) {
                    const lunchStartTime = new Date(currentTime.getTime() + 10 * 60000);
                    const lunchEndTime = new Date(lunchStartTime.getTime() + 60 * 60000);
                    const lunchBreak = document.createElement('div');
                    lunchBreak.className = 'break';
                    lunchBreak.innerHTML = `<div>Lunch Break</div><div>${formatTime(lunchStartTime)} - ${formatTime(lunchEndTime)}</div>`;
                    scheduleContainer.appendChild(lunchBreak);
                }
            }
        }

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            if (searchTerm.length > 0) {
                const filteredTalks = talks.filter(talk =>
                    talk.category.some(cat => cat.toLowerCase().includes(searchTerm))
                );
                renderSchedule(filteredTalks);
            } else {
                renderSchedule(null);
            }
        });

        // Initial render
        renderSchedule(null);

    </script>
</body>
</html>
